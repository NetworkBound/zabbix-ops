zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b7a1df9bd8374c2783f7b22ecc73c120
      name: Homelab/Security
  templates:
    - uuid: b480025cd48f4d9db44d1c8a2ab2facc
      template: 'Homelab Frigate NVR'
      name: 'Homelab Frigate NVR'
      description: 'Template for Frigate NVR container'
      groups:
        - name: Homelab/Security
      items:
        - uuid: 43f31bb83df249c2a6d17b50f5a4425a
          name: 'Agent ping'
          type: ZABBIX_ACTIVE
          key: agent.ping
          delay: '60'
          triggers:
            - uuid: 33dba3844a93431a982c3ed56d5222ef
              expression: 'max(/Homelab Frigate NVR/agent.ping,3m)=0'
              name: '{HOST.NAME} is unreachable'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 975845561ee349bc8d39932d56655d68
          name: 'Docker containers running'
          type: ZABBIX_ACTIVE
          key: docker.containers.running
          delay: 60s
          history: 30d
          triggers:
            - uuid: 2e9de4ce8e794124991ba094b8eeb8a6
              expression: 'last(/Homelab Frigate NVR/docker.containers.running)=0'
              name: 'No Docker containers running on {HOST.NAME}'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: f37cd5f13247454593c53be456f5bebc
          name: 'Docker containers total'
          type: ZABBIX_ACTIVE
          key: docker.containers.total
          delay: 60s
          history: 30d
        - uuid: a33ca58c6edd4a6089f89e742f77087c
          name: 'Docker images total'
          type: ZABBIX_ACTIVE
          key: docker.images.total
          delay: 60s
          history: 30d
        - uuid: 1e9496f94f0c40a5b08f1850d9423b24
          name: 'Max open file descriptors'
          type: ZABBIX_ACTIVE
          key: kernel.maxfiles
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: 7d74fd0a9c1b4f66887261bcb9866a4a
          name: 'Open file descriptors'
          type: ZABBIX_ACTIVE
          key: kernel.openfiles
          delay: 60s
          history: 30d
        - uuid: c90d8fb4c86f4ce1b9b8c827b807dcdb
          name: 'Network in bytes (ens18)'
          type: ZABBIX_ACTIVE
          key: 'net.if.in[ens18,bytes]'
          delay: 60s
          history: 30d
          units: Bps
        - uuid: ca58c77f1bbe46bc9ea6576d43fd6a24
          name: 'Network in errors (ens18)'
          type: ZABBIX_ACTIVE
          key: 'net.if.in[ens18,errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: 5efd7305132845838f3bda47ecb7d72e
          name: 'Network in packets (ens18)'
          type: ZABBIX_ACTIVE
          key: 'net.if.in[ens18,packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 080a0771f264471dba8622e1f6a7d462
          name: 'Network out bytes (ens18)'
          type: ZABBIX_ACTIVE
          key: 'net.if.out[ens18,bytes]'
          delay: 60s
          history: 30d
          units: Bps
        - uuid: edd27244bd6144e3a24833595180c4eb
          name: 'Network out errors (ens18)'
          type: ZABBIX_ACTIVE
          key: 'net.if.out[ens18,errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: 636f2353806643a99b07e1d4c020740f
          name: 'Network out packets (ens18)'
          type: ZABBIX_ACTIVE
          key: 'net.if.out[ens18,packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: dc7c7d2f45024ec4ae47f3f048fa1abe
          name: 'Frigate process'
          type: ZABBIX_ACTIVE
          key: 'proc.num[,,,-m frigate]'
          delay: '60'
          triggers:
            - uuid: 041ed73e10f4400f8fd5c423f276817c
              expression: 'last(/Homelab Frigate NVR/proc.num[,,,-m frigate])=0'
              name: 'Frigate NVR down on {HOST.NAME}'
              priority: HIGH
              description: 'Frigate process is not running'
            - uuid: 78587ca51b394f768352babaed5caa3f
              expression: 'last(/Homelab Frigate NVR/proc.num[,,,-m frigate])=0'
              name: '{HOST.NAME}: Frigate process not running'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 631ee28da5124a7fa3da85452326ffa3
          name: 'Running processes'
          type: ZABBIX_ACTIVE
          key: 'proc.num[,,run]'
          delay: 60s
          history: 30d
        - uuid: 7d797c245f18402eabcb2f3221333aad
          name: 'Total processes'
          type: ZABBIX_ACTIVE
          key: 'proc.num[]'
          delay: 60s
          history: 30d
        - uuid: 1011a9cff0f341c39f1f4df80bad4817
          name: 'CPU load avg (1m)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[all,avg1]'
          delay: 60s
          history: 30d
          value_type: FLOAT
        - uuid: 830895648b1c49bb814ca93c8f667bed
          name: 'CPU load avg (5m)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[all,avg5]'
          delay: 60s
          history: 30d
          value_type: FLOAT
        - uuid: 1f6c324c49c7487fa6bec74d2be7b96a
          name: 'CPU load avg (15m)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[all,avg15]'
          delay: 60s
          history: 30d
          value_type: FLOAT
        - uuid: 72b733b57e5c4282a09552affe2742e3
          name: 'Number of CPUs'
          type: ZABBIX_ACTIVE
          key: system.cpu.num
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: b6692f67eb674d989c44761f5f8b855f
          name: 'CPU iowait %'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,iowait]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 1fc5792e588d44209f0b4ffed803eb89
              expression: 'avg(/Homelab Frigate NVR/system.cpu.util[,iowait],10m)>20'
              name: 'High iowait on {HOST.NAME} (>20%)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 551359a868f94efc8b790c047c29fd11
          name: 'CPU nice time %'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,nice]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 9db87e89bf504c7c90b6be3e8b6c0457
          name: 'CPU steal time %'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,steal]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 5729c027458f4746918047887c368eb4
          name: 'CPU system time %'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,system]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: b9dddc35801c4923940b1e6799a33fb4
          name: 'CPU user time %'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,user]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 2db111e720904d19864e0a23f936034d
          name: 'System hostname'
          type: ZABBIX_ACTIVE
          key: system.hostname
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: 1fd3aadbb570487d89e6e8750cc2d21a
          name: 'OS version'
          type: ZABBIX_ACTIVE
          key: 'system.sw.os[]'
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: e786e5b512b2435d90f39d34244187da
          name: 'Swap free'
          type: ZABBIX_ACTIVE
          key: 'system.swap.size[,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 7f7156fae1ee46119540cfa1b0a67ea5
          name: 'Swap total'
          type: ZABBIX_ACTIVE
          key: 'system.swap.size[,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 23e2acd7058147a1b9ded90fd2292115
          name: 'Swap used'
          type: ZABBIX_ACTIVE
          key: 'system.swap.size[,used]'
          delay: 60s
          history: 30d
          units: B
        - uuid: eeaceca6fff54df0ae9dc46413a7946f
          name: 'System kernel info'
          type: ZABBIX_ACTIVE
          key: system.uname
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: 283a1900d0274a50ac62044633f70631
          name: 'System uptime'
          type: ZABBIX_ACTIVE
          key: system.uptime
          delay: 1h
          history: 30d
          value_type: FLOAT
          units: uptime
        - uuid: 81cedc46127249a9984391c66ffd131e
          name: 'Logged-in users'
          type: ZABBIX_ACTIVE
          key: system.users.num
          delay: 60s
          history: 30d
          trends: '0'
        - uuid: 6dc6e53e6eaf4162ab96030e9b760a60
          name: 'Disk read bytes/s (sda)'
          type: ZABBIX_ACTIVE
          key: 'vfs.dev.read[sda,bytes]'
          delay: 60s
          history: 30d
          units: Bps
        - uuid: 73218cf3317040ad9b686dccb34dbc28
          name: 'Disk reads/s (sda)'
          type: ZABBIX_ACTIVE
          key: 'vfs.dev.read[sda,ops]'
          delay: 60s
          history: 30d
          units: ops
        - uuid: ce9993e6c28a459087d49c775568d540
          name: 'Disk write bytes/s (sda)'
          type: ZABBIX_ACTIVE
          key: 'vfs.dev.write[sda,bytes]'
          delay: 60s
          history: 30d
          units: Bps
        - uuid: 5bd120a393ed40fd82e7134f041d134a
          name: 'Disk writes/s (sda)'
          type: ZABBIX_ACTIVE
          key: 'vfs.dev.write[sda,ops]'
          delay: 60s
          history: 30d
          units: ops
        - uuid: a76c0dca38dd4ffdae157c47ef5a8e5e
          name: 'Disk / free bytes'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 3d54bfa6c9574f79bdeec09a0fd25d71
          name: 'Disk space used /'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,pused]'
          delay: '120'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 74d00463cce24be8a8a425f9edeef926
              expression: 'last(/Homelab Frigate NVR/vfs.fs.size[/,pused])>{$FS.PUSED.MAX:=80}'
              name: 'Disk space low on {HOST.NAME} (>{$FS.PUSED.MAX:=80}%)'
              priority: AVERAGE
              manual_close: 'YES'
            - uuid: 502cac91e2994cf196387a50415ea898
              expression: 'last(/Homelab Frigate NVR/vfs.fs.size[/,pused])>85'
              name: 'NVR disk space critical on {HOST.NAME}'
              priority: HIGH
              description: 'NVR recordings may fill disk'
        - uuid: eb1d990acdb54aa1bb634f586cd22bb8
          name: 'Disk / total bytes'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 38fd68938fff4bbe943be58b36372e11
          name: 'Disk / used bytes'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,used]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 5e0923db15e04b80b8c70dcd7e0375df
          name: 'Recordings disk /media free'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/media,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 8cd8a7143f7e439f983e2f2078841b9a
          name: 'Recordings disk /media used %'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/media,pused]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 928cc58fa0264a06bb07c0425dc6fc2c
              expression: 'last(/Homelab Frigate NVR/vfs.fs.size[/media,pused])>{$MEDIA.PUSED.CRIT:=95}'
              name: 'Recordings disk space critical on {HOST.NAME} (>{$MEDIA.PUSED.CRIT:=95}%)'
              priority: HIGH
              manual_close: 'YES'
            - uuid: 3f06ba632a1e4a4b8db7cc8f1177fb21
              expression: 'last(/Homelab Frigate NVR/vfs.fs.size[/media,pused])>{$MEDIA.PUSED.MAX:=85}'
              name: 'Recordings disk space low on {HOST.NAME} (>{$MEDIA.PUSED.MAX:=85}%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: a285968d408a44d7812a69e98a712d4a
          name: 'Recordings disk /media total'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/media,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 03247ab877474e19959e97e721eebadf
          name: 'Memory available'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[available]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 6624ea75d6254e5f89b69ba64932bbc1
          name: 'Memory buffers'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[buffers]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 497ab34caf174ea1984cd2b093e82fea
          name: 'Memory cached'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[cached]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 4542a9972527424e8e89ad75302a637c
          name: 'Memory free'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 5fc4146e168442a88823d69dfa850c69
          name: 'Memory used percentage'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[pused]'
          delay: '60'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: f067e186cd9f44c285860d56bbbad040
              expression: 'last(/Homelab Frigate NVR/vm.memory.size[pused])>{$MEM.PUSED.MAX:=85}'
              name: 'High memory usage on {HOST.NAME} (>{$MEM.PUSED.MAX:=85}%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: 82df05fcd5b7453b986cfa898532dab5
          name: 'Total memory'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 99ffafc7b2804514a334e50bf07ebcdd
          name: 'Memory used'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[used]'
          delay: 60s
          history: 30d
          units: B
  triggers:
    - uuid: 280161602fad404c9780b6f83940df94
      expression: 'avg(/Homelab Frigate NVR/system.cpu.util[,user],5m)+avg(/Homelab Frigate NVR/system.cpu.util[,system],5m)>85'
      name: 'High CPU usage on {HOST.NAME} (>{$CPU.UTIL.CRIT:=85}%)'
      priority: AVERAGE
      manual_close: 'YES'
