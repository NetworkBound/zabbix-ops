zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b41361162e9e4b73a66e9f1fee3bd4b1
      name: Homelab/Docker
  templates:
    - uuid: 7e3dcb487eb84d899838051a8ead9f1d
      template: 'Homelab Docker Host'
      name: 'Homelab Docker Host'
      description: 'Template for Docker VM hosts - monitors Docker daemon and containers'
      groups:
        - name: Homelab/Docker
      items:
        - uuid: 2f1ed8006c2e40eaa7665bd4f6277ae8
          name: 'Agent ping'
          key: agent.ping
          delay: '60'
          triggers:
            - uuid: fa15b7b9d4034554858ac9d1005c875b
              expression: 'nodata(/Homelab Docker Host/agent.ping,300)'
              name: '{HOST.NAME} is unreachable'
              priority: HIGH
        - uuid: 89d4ced8e7ee4550b50e2adde830d323
          name: 'Docker containers running'
          key: docker.containers.running
          delay: '60'
          triggers:
            - uuid: 5b4668587c0944dcbf253dd03522a526
              expression: 'last(/Homelab Docker Host/docker.containers.running)=0'
              name: 'No Docker containers running on {HOST.NAME}'
              priority: AVERAGE
              manual_close: 'YES'
            - uuid: 1f02514bf50643789d57fd2f620b6b13
              expression: 'change(/Homelab Docker Host/docker.containers.running)<-1'
              name: '{HOST.NAME}: Docker container count dropped'
              priority: WARNING
              manual_close: 'YES'
            - uuid: a4b175d5cafb4c43baa82391deebef40
              expression: 'last(/Homelab Docker Host/docker.containers.running)=0'
              name: '{HOST.NAME}: No running Docker containers'
              priority: AVERAGE
              description: 'All Docker containers are stopped — Gluetun, qBittorrent likely down'
        - uuid: 92ddb9488efc4588a80f6e64a0e267e9
          name: 'Docker containers total'
          key: docker.containers.total
          delay: '120'
        - uuid: 05f3995a5b5e41dc99d3da970365b771
          name: 'Docker images count'
          key: docker.images.total
          delay: '300'
        - uuid: d0d00c5e9b5a4c2f8b704470c1886c9f
          name: 'Open fds'
          key: kernel.openfiles
          delay: 60s
          history: 30d
        - uuid: f1ea73c6f92d4563b047de7e654f1427
          name: 'Network in dropped'
          key: 'net.if.in[{$NET.IFACE},dropped]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 24daf7c43ec44d42b11ffeb859d441ab
          name: 'Network in errors'
          key: 'net.if.in[{$NET.IFACE},errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: bff47db2fb2d47cbbae56c462c4719a6
          name: 'Network in packets'
          key: 'net.if.in[{$NET.IFACE},packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 6a7cb0d3e37141c2a39ba976e221efc0
          name: 'Network in'
          key: 'net.if.in[{$NET.IFACE}]'
          delay: 60s
          history: 7d
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: 6d578eeacce141449060f2521c8d523d
          name: 'Network out dropped'
          key: 'net.if.out[{$NET.IFACE},dropped]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 02fe951abc3740c3a5e77391eb234e18
          name: 'Network out errors'
          key: 'net.if.out[{$NET.IFACE},errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: 1c1c30a09a444d5093305afbe8f32593
          name: 'Network out packets'
          key: 'net.if.out[{$NET.IFACE},packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 62055885e312459cab22a83f59774202
          name: 'Network out'
          key: 'net.if.out[{$NET.IFACE}]'
          delay: 60s
          history: 7d
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: 2c89d222f0d34924bea22ecec8dbf3a4
          name: 'SSH port listening'
          key: 'net.tcp.listen[22]'
          delay: 60s
          history: 30d
          trends: '0'
        - uuid: 40f7830eaf714ab3a199811a4f5a0601
          name: 'Total processes'
          key: 'proc.num[]'
          delay: 60s
          history: 30d
        - uuid: cf32eb20ad534b9fb7fd87b0c5ef1868
          name: 'CPU load avg (1m)'
          key: 'system.cpu.load[all,avg1]'
          delay: 60s
          history: 30d
          value_type: FLOAT
        - uuid: 80206d92619742fe874a0ad1bbadd700
          name: 'CPU load avg (5m)'
          key: 'system.cpu.load[all,avg5]'
          delay: 60s
          history: 30d
          value_type: FLOAT
        - uuid: 6b63aa5c52084016bfa46565c39b9208
          name: 'CPU load avg (15m)'
          key: 'system.cpu.load[all,avg15]'
          delay: 60s
          history: 30d
          value_type: FLOAT
        - uuid: 4b984598910f4bc8aaeb181330966b61
          name: 'Number of CPUs'
          key: system.cpu.num
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: 7370a5515e574905aca5b566ae8645d7
          name: 'CPU utilization'
          key: 'system.cpu.util[,idle]'
          delay: 60s
          history: 7d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 100 - value;'
          triggers:
            - uuid: b488c7e9b125415aa8f7fd144a6cdb08
              expression: 'avg(/Homelab Docker Host/system.cpu.util[,idle],5m)>85'
              name: 'High CPU on Docker host {HOST.NAME}'
              priority: AVERAGE
        - uuid: 0194c8174ebd47e38d1a26c9fb561b8b
          name: 'CPU iowait %'
          key: 'system.cpu.util[,iowait]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: bbbe2bb060ad47b59b45490faf98b570
              expression: 'avg(/Homelab Docker Host/system.cpu.util[,iowait],10m)>20'
              name: 'High iowait on {HOST.NAME} (>20%)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: d8206f65687046ba873497acc89c2ad8
          name: 'CPU steal time %'
          key: 'system.cpu.util[,steal]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: cad013aa03e145648192ce7631585f10
          name: 'CPU system time %'
          key: 'system.cpu.util[,system]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: ca68070254544ffaa250ccdbd8fc58e7
          name: 'CPU user time %'
          key: 'system.cpu.util[,user]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 6facb484e2d144229ae82d844b601c80
          name: 'System hostname'
          key: system.hostname
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: e169d80ff37f42b287dd59cb1f954294
          name: 'Swap free'
          key: 'system.swap.size[,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 4e3eaa2066fd4623a3703c9ea0d717ed
          name: 'Swap used %'
          key: 'system.swap.size[,pused]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 8b4a2b5fd404456da89258bbce9a94ba
          name: 'Swap total'
          key: 'system.swap.size[,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 81e8f066fb964b40820c7f2b337b53e2
          name: 'Swap used'
          key: 'system.swap.size[,used]'
          delay: 60s
          history: 30d
          units: B
        - uuid: ab9bd2e4b0b4457d9ab90a48bae10133
          name: 'System kernel info'
          key: system.uname
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: 75545fb0ac2a4188b6160805c59f7278
          name: 'System uptime'
          key: system.uptime
          delay: '300'
          units: uptime
        - uuid: 84e93a221d7840c7b1637b5d9e6bb111
          name: 'Logged-in users'
          key: system.users.num
          delay: 60s
          history: 30d
          trends: '0'
        - uuid: caf4b789451e4460b7f1f74a727dc80a
          name: 'Disk / free'
          key: 'vfs.fs.size[/,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 3c4460075cd249f8a2bf1408bb4c8886
          name: 'Disk space used /'
          key: 'vfs.fs.size[/,pused]'
          delay: '300'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: c70d8958c4044f828d8e6fe1d817115b
              expression: 'last(/Homelab Docker Host/vfs.fs.size[/,pused])>85'
              name: 'Disk space critical on Docker host {HOST.NAME}'
              priority: HIGH
              description: 'Docker host disk above 85% - containers may fail'
            - uuid: c8f3da3fcae44362a00bcfe609b237e9
              expression: 'last(/Homelab Docker Host/vfs.fs.size[/,pused])>{$FS.PUSED.MAX:=80}'
              name: 'Disk space low on {HOST.NAME} (>{$FS.PUSED.MAX:=80}%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: fcf3e8b1b4534d07b95b00e20e8221d3
          name: 'Disk / total'
          key: 'vfs.fs.size[/,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 6bd88c975aea48dc8ca3c1a35ae2ae9f
          name: 'Disk / used'
          key: 'vfs.fs.size[/,used]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 9143ef9b6ade44b0bc63955efe8bdd6c
          name: 'Memory available'
          key: 'vm.memory.size[available]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 3cecd94ded8a4949bfd94ab218f0e408
          name: 'Memory cached'
          key: 'vm.memory.size[cached]'
          delay: 60s
          history: 30d
          units: B
        - uuid: ba0e56cbb7a04880b92d68274b4401fe
          name: 'Memory free'
          key: 'vm.memory.size[free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: fa7c3438c31b441fb1e6b0501f8a51b0
          name: 'Memory used percentage'
          key: 'vm.memory.size[pused]'
          delay: '60'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 920a6f8801874c8aa3210f2ebb3ce38d
              expression: 'last(/Homelab Docker Host/vm.memory.size[pused])>{$MEM.PUSED.MAX:=85}'
              name: 'High memory usage on {HOST.NAME} (>{$MEM.PUSED.MAX:=85}%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: c290ab4b7087432b800fb76e6b13c7f7
          name: 'Memory total'
          key: 'vm.memory.size[total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 907e97904396426ea5846ac77d95de72
          name: 'Memory used'
          key: 'vm.memory.size[used]'
          delay: 60s
          history: 30d
          units: B
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '85'
        - macro: '{$FS.PUSED.MAX}'
          value: '80'
        - macro: '{$NET.IFACE}'
          value: eth0
          description: 'Network interface to monitor'
  triggers:
    - uuid: 6d942f42843942c4a3ef9a24806a48bc
      expression: 'last(/Homelab Docker Host/docker.containers.running)=0 and last(/Homelab Docker Host/docker.containers.total)>0'
      name: 'Docker daemon down on {HOST.NAME}'
      priority: HIGH
      description: 'No Docker containers running but images exist'
    - uuid: 1f83b1103c57497ea0b60d40c023b5e5
      expression: 'avg(/Homelab Docker Host/system.cpu.util[,user],5m)+avg(/Homelab Docker Host/system.cpu.util[,system],5m)>85'
      name: 'High CPU usage on {HOST.NAME} (>{$CPU.UTIL.CRIT:=85}%)'
      priority: AVERAGE
      manual_close: 'YES'
    - uuid: 9d8c562562564c1dbae7197e844f278a
      expression: 'last(/Homelab Docker Host/vm.memory.size[available]) / last(/Homelab Docker Host/vm.memory.size[total]) * 100 < 10'
      name: 'High memory on Docker host {HOST.NAME}'
      priority: HIGH
      description: |
        Docker host memory above 90%
        [fixed 2026-08-21] Was vm.memory.size[pused], which counts reclaimable page cache as used. PBS showed 93.7% 'used' while 93.7% was actually AVAILABLE (2.0G of 2.1G free, the rest being backup-IO page cache). Now measures real available memory.
