zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: e9771ad643074cc88a98231d117b1a7b
      name: Homelab/Containers
  templates:
    - uuid: 20352a32db9f49f49be444990126e9bf
      template: 'Homelab LXC Container'
      name: 'Homelab LXC Container'
      description: 'Template for Proxmox LXC containers - monitors CPU, RAM, disk, network, and process count'
      groups:
        - name: Homelab/Containers
      items:
        - uuid: 642feea5fa0c40cfa8d61545ab3c037f
          name: 'Agent ping'
          key: agent.ping
          delay: '60'
          triggers:
            - uuid: 0a561be2bc0642369bd0eae4968c862a
              expression: 'nodata(/Homelab LXC Container/agent.ping,300)'
              name: '{HOST.NAME} is unreachable'
              priority: HIGH
              description: 'No agent data received for 5 minutes'
              manual_close: 'YES'
        - uuid: 51dbde57fe56487799c5a49a806a2858
          name: 'Max open fds'
          key: kernel.maxfiles
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: 11e71d4d4369469cbf96df1f819e6cca
          name: 'Open fds'
          key: kernel.openfiles
          delay: 60s
          history: 30d
        - uuid: ade57b962a7c4545910d81f18c7da822
          name: 'Network in dropped'
          key: 'net.if.in[{$NET.IFACE},dropped]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: c2c2dde9dae14f67bfc3c1aa346a2d4c
          name: 'Network in errors'
          key: 'net.if.in[{$NET.IFACE},errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: 1803f5486e0a4f06ac918f25cc26945f
          name: 'Network in packets'
          key: 'net.if.in[{$NET.IFACE},packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 2b34376bb8224ac0aeca53d0affae6bd
          name: 'Network in'
          key: 'net.if.in[{$NET.IFACE}]'
          delay: 60s
          history: 7d
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: 0fb61b71998049b19e9cb2bcedfe4b86
          name: 'Network out dropped'
          key: 'net.if.out[{$NET.IFACE},dropped]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 8ab670ab0e0242a5ade4c202c288eb34
          name: 'Network out errors'
          key: 'net.if.out[{$NET.IFACE},errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: 57a2a093d8ef45fb8a3389d6c25e957e
          name: 'Network out packets'
          key: 'net.if.out[{$NET.IFACE},packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 10575a5c9cc94708b0d2db83f2cf652d
          name: 'Network out'
          key: 'net.if.out[{$NET.IFACE}]'
          delay: 60s
          history: 7d
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: d3831b07adbe4a80b818ee457307e21e
          name: 'SSH port listening'
          key: 'net.tcp.listen[22]'
          delay: 60s
          history: 30d
          trends: '0'
          triggers:
            - uuid: 360c2e364b2643e78d90bf9ced9336a7
              expression: 'last(/Homelab LXC Container/net.tcp.listen[22])=0'
              name: 'SSH not listening on {HOST.NAME}'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 875303c1b6e34cfd94d97745d964580d
          name: 'Number of processes'
          key: 'proc.num[]'
          delay: '120'
          triggers:
            - uuid: 0e2dc929b0cc4a23bd67b416e560b5b1
              expression: 'last(/Homelab LXC Container/proc.num[])>{$PROC.NUM.MAX}'
              name: '{HOST.NAME}: Too many processes running (>{$PROC.NUM.MAX})'
              priority: WARNING
              description: 'Updated 2026-04-28: Made threshold configurable via {$PROC.NUM.MAX}. Proxmox hosts need higher value due to LXC/VM thread inflation.'
              manual_close: 'YES'
        - uuid: fa696c898cf84df1b3233bdbd36167d3
          name: 'CPU load (1 min avg)'
          key: 'system.cpu.load[all,avg1]'
          delay: 60s
          history: 7d
          value_type: FLOAT
        - uuid: c83256b8a8454a668c6612184961fd95
          name: 'CPU load (5 min avg)'
          key: 'system.cpu.load[all,avg5]'
          delay: 60s
          history: 7d
          value_type: FLOAT
        - uuid: bd5a5c8005a740efa0fe9481790b90bf
          name: 'CPU load avg (15m)'
          key: 'system.cpu.load[all,avg15]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          triggers:
            - uuid: f06caf8f971e4f48ad0ac40ecba8245a
              expression: 'avg(/Homelab LXC Container/system.cpu.load[all,avg15],10m)>10'
              name: 'High CPU load per core on {HOST.NAME} (>10 avg15)'
              status: DISABLED
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: 0d115f287b3d481aa6b84066a7e14df5
          name: 'Number of CPUs'
          key: system.cpu.num
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: e918244755af4bb190b998196a5c6048
          name: 'CPU utilization'
          key: 'system.cpu.util[,idle]'
          delay: 60s
          history: 7d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 100 - value;'
          triggers:
            - uuid: 8096ce5130ba480ebcae2325463a26fe
              expression: 'avg(/Homelab LXC Container/system.cpu.util[,idle],5m)>85'
              name: 'High CPU on {HOST.NAME}'
              priority: AVERAGE
        - uuid: 814353d15c25444fa4cc01bd81a46375
          name: 'CPU iowait %'
          key: 'system.cpu.util[,iowait]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 69dffc9efdbd42e98be845c2853857cf
              expression: 'avg(/Homelab LXC Container/system.cpu.util[,iowait],10m)>20'
              name: 'High iowait on {HOST.NAME} (>20%)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 175a37eb18e544b28b6d378f1dd1b1de
          name: 'CPU steal time %'
          key: 'system.cpu.util[,steal]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: f5b77b3297f04c4abb24239053191b44
          name: 'CPU system time %'
          key: 'system.cpu.util[,system]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 99fcb821686b4f019d27892a78f049eb
          name: 'CPU user time %'
          key: 'system.cpu.util[,user]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 146036754beb42398f97abbf06d6384a
              expression: 'min(/Homelab LXC Container/system.cpu.util[,user],15m)>90'
              name: '{HOST.NAME}: High CPU utilization (>90% for 15min)'
              priority: AVERAGE
            - uuid: cc934437631340c99bfcc84b41c2ef11
              expression: 'min(/Homelab LXC Container/system.cpu.util[,user],5m)>95'
              name: '{HOST.NAME}: Very high CPU utilization (>95% for 5min)'
              priority: HIGH
        - uuid: 4a0641a0db7a4290bd72e6a6114fb13a
          name: 'System hostname'
          key: system.hostname
          delay: '3600'
          value_type: CHAR
        - uuid: decc56c8df464249be625206f3d30c0b
          name: 'OS version'
          key: 'system.sw.os[]'
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: 36007ec66ec9478384a8bbc03d5b3df6
          name: 'Swap free'
          key: 'system.swap.size[,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 5b3d431a47f44142b7001a872a3b39e8
          name: 'System swap used %'
          key: 'system.swap.size[,pused]'
          delay: 60s
          history: 7d
          value_type: FLOAT
          units: '%'
        - uuid: c13a895f4af44f77a7febed4ea0730ed
          name: 'Swap total'
          key: 'system.swap.size[,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: 4d6bc3bf0b6b404c908d6bd8c79a2eb6
          name: 'Swap used'
          key: 'system.swap.size[,used]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 051758b43bec4e2ab73bacc36affc139
          name: 'System kernel info'
          key: system.uname
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: 121e6bf212814e6e82d7adb41a279029
          name: 'System uptime'
          key: system.uptime
          delay: '300'
          units: uptime
          triggers:
            - uuid: 20b197828365476b8c700528e87ca2fa
              expression: 'last(/Homelab LXC Container/system.uptime)<600'
              name: '{HOST.NAME} has been restarted'
              priority: INFO
              description: 'Container uptime is less than 10 minutes'
              manual_close: 'YES'
        - uuid: 23f26760530344cd8002818defde7254
          name: 'Logged-in users'
          key: system.users.num
          delay: 60s
          history: 30d
          trends: '0'
        - uuid: eb86bd5b1b15471faef59bd32a8172e0
          name: 'Disk read bytes/s'
          key: 'vfs.dev.read[sda,bytes]'
          delay: 60s
          history: 30d
          units: Bps
        - uuid: 38bcef0cab56434fb28975af7572efd0
          name: 'Disk read ops/s'
          key: 'vfs.dev.read[sda,ops]'
          delay: 60s
          history: 30d
          units: ops
        - uuid: a89beb025f02470b8fcea22d041cfd12
          name: 'Disk write bytes/s'
          key: 'vfs.dev.write[sda,bytes]'
          delay: 60s
          history: 30d
          units: Bps
        - uuid: ed7e606fc9a1403fa5cb555e00627320
          name: 'Disk write ops/s'
          key: 'vfs.dev.write[sda,ops]'
          delay: 60s
          history: 30d
          units: ops
        - uuid: 4aca76ddf65f46bab68808a35203e78c
          name: 'Disk space free /'
          key: 'vfs.fs.size[/,free]'
          delay: '300'
          units: B
        - uuid: 28ca7204ada340ef8039e5d15ab5fb9b
          name: 'Disk space used /'
          key: 'vfs.fs.size[/,pused]'
          delay: '300'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: e01c47c42c704b40a48740630ae7b97a
              expression: 'last(/Homelab LXC Container/vfs.fs.size[/,pused])>90'
              name: 'Disk space critical on {HOST.NAME}'
              priority: HIGH
              description: 'Root disk usage above 90%'
            - uuid: d54d8e64e9ca43b28a6c18cff7f054dc
              expression: 'last(/Homelab LXC Container/vfs.fs.size[/,pused])>{$FS.PUSED.MAX:=80}'
              name: 'Disk space low on {HOST.NAME} (>{$FS.PUSED.MAX:=80}%)'
              priority: AVERAGE
              manual_close: 'YES'
            - uuid: 48d7faf963934d01825b93fe7af38b3b
              expression: 'last(/Homelab LXC Container/vfs.fs.size[/,pused])>80'
              name: 'Disk space warning on {HOST.NAME}'
              priority: WARNING
              description: 'Root disk usage above 80%'
        - uuid: 0f9e74e5e1f34192babe429e23be88a9
          name: 'Disk space total /'
          key: 'vfs.fs.size[/,total]'
          delay: '3600'
          units: B
        - uuid: 6704f24fcb9b46eb83a06dd6458d879f
          name: 'Disk space used bytes /'
          key: 'vfs.fs.size[/,used]'
          delay: 60s
          history: 7d
          units: B
        - uuid: e12b81d9f45c4a0a80f9cd1122e52ffc
          name: 'Memory available'
          key: 'vm.memory.size[available]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 3a60f5cfa1c94024a5f5858f4a29dcf3
          name: 'Memory buffers'
          key: 'vm.memory.size[buffers]'
          delay: 60s
          history: 30d
          units: B
        - uuid: e2e5c64c09624d1abe9e365da88c5c8b
          name: 'Memory cached'
          key: 'vm.memory.size[cached]'
          delay: 60s
          history: 30d
          units: B
        - uuid: ecd9ccb8de0c401899efc4aca5bf398d
          name: 'Memory free'
          key: 'vm.memory.size[free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 8762a468e7954e89b0409e9918178004
          name: 'Memory used percentage'
          key: 'vm.memory.size[pused]'
          delay: '60'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 7cad823a19804fb78af58994ba0fb02c
              expression: 'last(/Homelab LXC Container/vm.memory.size[pused])>{$MEM.PUSED.MAX:=85}'
              name: 'High memory usage on {HOST.NAME} (>{$MEM.PUSED.MAX:=85}%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: bb050cfac352437c9cb343eaf17a3d6b
          name: 'Memory total'
          key: 'vm.memory.size[total]'
          delay: '300'
          units: B
        - uuid: ac244708693d4b71a39f11199fecdcf8
          name: 'Memory used'
          key: 'vm.memory.size[used]'
          delay: '60'
          units: B
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '85'
        - macro: '{$LOAD.AVG.CRIT}'
          value: '10'
        - macro: '{$NET.IFACE}'
          value: eth0
          description: 'Primary network interface name'
  triggers:
    - uuid: dd64666869e24b34a340c70955be8346
      expression: 'avg(/Homelab LXC Container/system.cpu.util[,user],5m)+avg(/Homelab LXC Container/system.cpu.util[,system],5m)>85'
      name: 'High CPU usage on {HOST.NAME} (>{$CPU.UTIL.CRIT:=85}%)'
      priority: AVERAGE
      manual_close: 'YES'
    - uuid: c313d6a6e80e49829eafed5075256571
      expression: 'last(/Homelab LXC Container/vm.memory.size[available]) / last(/Homelab LXC Container/vm.memory.size[total]) * 100 < 10'
      name: 'High memory on {HOST.NAME}'
      priority: HIGH
      description: |
        Memory usage is above 90%
        [fixed 2026-08-21] Was vm.memory.size[pused], which counts reclaimable page cache as used. PBS showed 93.7% 'used' while 93.7% was actually AVAILABLE (2.0G of 2.1G free, the rest being backup-IO page cache). Now measures real available memory.
    - uuid: 398d73c9db4a45998a08c310422f1556
      expression: 'last(/Homelab LXC Container/vm.memory.size[available]) / last(/Homelab LXC Container/vm.memory.size[total]) * 100 < 20'
      name: 'Low memory warning on {HOST.NAME}'
      priority: WARNING
      description: '[fixed 2026-08-21] Was vm.memory.size[pused], which counts reclaimable page cache as used. PBS showed 93.7% ''used'' while 93.7% was actually AVAILABLE (2.0G of 2.1G free, the rest being backup-IO page cache). Now measures real available memory.'
      manual_close: 'YES'
