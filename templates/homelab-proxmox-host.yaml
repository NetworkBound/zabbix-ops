zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 00f03439f3ea4f338e84f01098d0e4ed
      name: Homelab/Infrastructure
  templates:
    - uuid: 034b4c86fdec400ab491acae07147a99
      template: 'Homelab Proxmox Host'
      name: 'Homelab Proxmox Host'
      description: 'Template for Proxmox host node - monitors hypervisor health via SNMP'
      groups:
        - name: Homelab/Infrastructure
      items:
        - uuid: b67d4d07b4134d2fa9d36a97373cc230
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '30'
          triggers:
            - uuid: 832ef18f71f3476b9258c45e9d709bdf
              expression: 'max(/Homelab Proxmox Host/icmpping,3)=0'
              name: 'Proxmox host {HOST.NAME} is down'
              priority: DISASTER
              description: 'Proxmox host is not responding to ping'
            - uuid: 7e8e08f7c0f14dbd8738777c8c53454e
              expression: 'max(/Homelab Proxmox Host/icmpping,3m)=0'
              name: '{HOST.NAME}: ICMP ping failed'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 2a658620d4c24b428d5846aae9dc4c85
          name: 'ICMP packet loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: fb0f8830c9914ad7938ded850e92baaa
              expression: 'avg(/Homelab Proxmox Host/icmppingloss,5m)>10'
              name: '{HOST.NAME}: High ICMP packet loss (>10%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: e6ca1608a7e448e4b503e8124f396484
          name: 'ICMP latency'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          value_type: FLOAT
          units: s
          triggers:
            - uuid: 44c8714a90e34e1d82750ab37da658de
              expression: 'avg(/Homelab Proxmox Host/icmppingsec,5m)>0.05'
              name: 'High latency to {HOST.NAME}'
              priority: WARNING
              description: 'Latency to Proxmox host above 50ms'
