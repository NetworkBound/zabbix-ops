zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: f67737f7df4646eda060638ee090a71e
      name: Homelab/Network
  templates:
    - uuid: 1741f3cd79464df885457908876edfb3
      template: 'Homelab Network Device'
      name: 'Homelab Network Device'
      description: 'Template for network devices (UniFi, switches) via SNMP'
      groups:
        - name: Homelab/Network
      items:
        - uuid: e86a2e17cb774957bf97e32d9836d5c0
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '30'
          triggers:
            - uuid: 551c77ffd5a14998b353c0a617cba4b7
              expression: 'max(/Homelab Network Device/icmpping,3)=0'
              name: 'Network device {HOST.NAME} is down'
              priority: DISASTER
              description: 'Network device not responding'
            - uuid: 43f3da80e6bb40dc9f53814d8cba1d3c
              expression: 'max(/Homelab Network Device/icmpping,3m)=0'
              name: '{HOST.NAME}: ICMP ping failed'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 0d5e9763d10f4ec0a2b73408db722a3d
          name: 'ICMP packet loss %'
          type: SIMPLE
          key: icmppingloss
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 0819b4ae5bf34b93912b9af50c46e911
              expression: 'avg(/Homelab Network Device/icmppingloss,5m)>10'
              name: '{HOST.NAME}: High ICMP packet loss (>10%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: 61406af1eccd4336a9f1f15299b60333
          name: 'ICMP latency'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          value_type: FLOAT
          units: s
          triggers:
            - uuid: 87be1cbc69a047a1b26d646b2da61c8c
              expression: 'avg(/Homelab Network Device/icmppingsec,5m)>0.15'
              name: '{HOST.NAME}: High ICMP response time (>150ms)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: a892c35d8e1343678be46a81cdbeb3e2
          name: 'SNMP sysName'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: sysName
          delay: '3600'
          value_type: CHAR
        - uuid: abed3a89c5834e919fda337aee3a2d40
          name: 'SNMP sysUpTime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sysUpTime
          delay: '300'
          units: uptime
          triggers:
            - uuid: 574380d0244b487ea88cb72e226c2052
              expression: 'last(/Homelab Network Device/sysUpTime)<600'
              name: 'Network device {HOST.NAME} restarted'
              priority: WARNING
              description: 'Network device uptime less than 10 minutes'
            - uuid: be3321b01f7c4a31816b9c50281e23c3
              expression: '(last(/Homelab Network Device/sysUpTime)<10m) and (nodata(/Homelab Network Device/sysUpTime,30m)=0)'
              name: '{HOST.NAME}: Network device restarted'
              priority: WARNING
              manual_close: 'YES'
