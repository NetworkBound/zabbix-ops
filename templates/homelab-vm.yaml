zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a69d5052198342eb9dce4a97c6c607be
      name: Homelab/VMs
  templates:
    - uuid: 7590a384dd614ee18039094a69f2b55f
      template: 'Homelab VM'
      name: 'Homelab VM'
      description: 'Template for Proxmox QEMU VMs - full OS monitoring'
      groups:
        - name: Homelab/VMs
      items:
        - uuid: f1ca836ad3794e62a0f772dfb34a0db9
          name: 'Agent ping'
          key: agent.ping
          delay: '60'
          triggers:
            - uuid: e3eb682d936b47f58be1071e12c96ae6
              expression: 'nodata(/Homelab VM/agent.ping,300)'
              name: '{HOST.NAME} is unreachable'
              priority: HIGH
              description: 'No agent data for 5 minutes'
        - uuid: dae01c3139e64327a8f43fc530b1ceae
          name: 'Max open fds'
          key: kernel.maxfiles
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: 559ab6aae249405f8ee402476146d47a
          name: 'Open fds'
          key: kernel.openfiles
          delay: 60s
          history: 30d
        - uuid: 877c66c75ef74b9a8a61f2bcbb2168c5
          name: 'Network in dropped'
          key: 'net.if.in[{$NET.IFACE},dropped]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 03f1d358d0b0447987c5dc7f4bd8b4df
          name: 'Network in errors'
          key: 'net.if.in[{$NET.IFACE},errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: c354025023a1410db8d90d9620f8998d
          name: 'Network in packets'
          key: 'net.if.in[{$NET.IFACE},packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: b1292144cbae47f8a00316e3a40ef2d6
          name: 'Network in'
          key: 'net.if.in[{$NET.IFACE}]'
          delay: 60s
          history: 7d
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: 94d1fca4e7f04123a039c2e773ae42d7
          name: 'Network out dropped'
          key: 'net.if.out[{$NET.IFACE},dropped]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 5b87eda91ca3414b9cb71de090eda0d4
          name: 'Network out errors'
          key: 'net.if.out[{$NET.IFACE},errors]'
          delay: 60s
          history: 30d
          units: eps
        - uuid: 31aa595cfc48466dabeb8e0f53bcd182
          name: 'Network out packets'
          key: 'net.if.out[{$NET.IFACE},packets]'
          delay: 60s
          history: 30d
          units: pps
        - uuid: 3ac43544cb59494e9d0ae93673e8c121
          name: 'Network out'
          key: 'net.if.out[{$NET.IFACE}]'
          delay: 60s
          history: 7d
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: a8168bc66b0a432bad9abb12b5a1b4d4
          name: 'SSH port listening'
          key: 'net.tcp.listen[22]'
          delay: 60s
          history: 30d
          trends: '0'
          triggers:
            - uuid: f9989c56d1794a0a9eefe05f78ee6223
              expression: 'last(/Homelab VM/net.tcp.listen[22])=0'
              name: 'SSH not listening on {HOST.NAME}'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 222124f9d4844afab720f902640af9cc
          name: 'Number of processes'
          key: 'proc.num[]'
          delay: '120'
        - uuid: 163ac44df7564543b99418523f9a0275
          name: 'CPU load avg 1m'
          key: 'system.cpu.load[all,avg1]'
          delay: '60'
          value_type: FLOAT
        - uuid: 346d9ba695ea457ca2578447ec08723c
          name: 'CPU load avg 5m'
          key: 'system.cpu.load[all,avg5]'
          delay: '60'
          value_type: FLOAT
        - uuid: 64b8bfee92054ca19700bfd9b5a7bf99
          name: 'CPU load avg (15m)'
          key: 'system.cpu.load[all,avg15]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          triggers:
            - uuid: fcf12bee80614febb64bf93ec61dd95c
              expression: 'avg(/Homelab VM/system.cpu.load[all,avg15],10m)>10'
              name: 'High CPU load per core on {HOST.NAME} (>10 avg15)'
              status: DISABLED
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: 81f2bc43ee3c464cb20c5f80ad0572f1
          name: 'Number of CPUs'
          key: system.cpu.num
          delay: 1h
          history: 30d
          trends: '0'
        - uuid: e8124a4b7741481f9515287a41cd87ca
          name: 'CPU utilization'
          key: 'system.cpu.util[,idle]'
          delay: 60s
          history: 7d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 100 - value;'
          triggers:
            - uuid: 2d9e97d67d9e49c0ad161bf53f90f07b
              expression: 'avg(/Homelab VM/system.cpu.util[,idle],5m)>85'
              name: 'High CPU on {HOST.NAME}'
              priority: AVERAGE
        - uuid: 2e7081374e6d41bab870fbac6f6f5412
          name: 'CPU iowait %'
          key: 'system.cpu.util[,iowait]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 54a12427e67442bf95aa60b02e67ff34
              expression: 'avg(/Homelab VM/system.cpu.util[,iowait],10m)>20'
              name: 'High iowait on {HOST.NAME} (>20%)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 60060b4c6eb243cfae932d25f0521592
          name: 'CPU steal time %'
          key: 'system.cpu.util[,steal]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 513bd96cbcaf4c7c95f4218629351e1e
          name: 'CPU system time %'
          key: 'system.cpu.util[,system]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: 53c219a595cf45488787689d1b81a70b
          name: 'CPU user time %'
          key: 'system.cpu.util[,user]'
          delay: 60s
          history: 30d
          value_type: FLOAT
          units: '%'
        - uuid: cbeac758982f4c76bf20425b983f354c
          name: 'System hostname'
          key: system.hostname
          delay: 3600s
          history: 7d
          value_type: TEXT
        - uuid: 4b23948dc32f49d18359f934148fb933
          name: 'OS version'
          key: 'system.sw.os[]'
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: f094e060ead7400dbb46ff26730b98b5
          name: 'Swap free'
          key: 'system.swap.size[,free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 3f5779d872fc42218b068df3bffe41de
          name: 'Swap used'
          key: 'system.swap.size[,pused]'
          delay: '300'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: f3fca004e87940949d7d2eff110f18bf
              expression: 'last(/Homelab VM/system.swap.size[,pused])>50'
              name: 'High swap on {HOST.NAME}'
              priority: WARNING
              description: 'Swap usage above 50%'
            - uuid: b0856ff3879a4aef84a247ecef1d156f
              expression: 'last(/Homelab VM/system.swap.size[,pused])>50'
              name: 'High swap usage on {HOST.NAME} (>50%)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: c7931edb0d914d03933b300b70404f8d
          name: 'Swap total'
          key: 'system.swap.size[,total]'
          delay: 1h
          history: 30d
          units: B
        - uuid: e99f864143974558a8ff5a1043062098
          name: 'Swap used'
          key: 'system.swap.size[,used]'
          delay: 60s
          history: 30d
          units: B
        - uuid: b7815dcf0f184bd08b030666344b52a0
          name: 'System kernel info'
          key: system.uname
          delay: 1h
          history: 30d
          value_type: CHAR
        - uuid: e68343f2c2f6413fbd54fae84ec97174
          name: 'System uptime'
          key: system.uptime
          delay: '300'
          units: uptime
          triggers:
            - uuid: 4af840f42d134d03994f6570fc919c87
              expression: 'last(/Homelab VM/system.uptime)<600'
              name: '{HOST.NAME} has been restarted'
              priority: INFO
              description: 'VM uptime less than 10 minutes'
              manual_close: 'YES'
        - uuid: 60cbda5586cc45d2af0bb7db1d85942d
          name: 'Logged-in users'
          key: system.users.num
          delay: 60s
          history: 30d
          trends: '0'
        - uuid: 829c290109a140b4beb8f056080aaf98
          name: 'Disk IOPS read'
          key: 'vfs.dev.read[,ops]'
          delay: '60'
          value_type: FLOAT
          units: ops/s
        - uuid: bb6ed94a5fbe44d9958ac7e868ff67cc
          name: 'Disk IOPS write'
          key: 'vfs.dev.write[,ops]'
          delay: '60'
          value_type: FLOAT
          units: ops/s
        - uuid: 3266f36eb1944b4f93db58b943d8d977
          name: 'Disk space free /'
          key: 'vfs.fs.size[/,free]'
          delay: 60s
          history: 7d
          units: B
        - uuid: d8e26e7ea58e47f59ba1a425bf6a0c76
          name: 'Disk space used /'
          key: 'vfs.fs.size[/,pused]'
          delay: '300'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: f5a0ebc5f97e4ff1bb24527c6aef80a7
              expression: 'last(/Homelab VM/vfs.fs.size[/,pused])>90'
              name: 'Disk space critical on {HOST.NAME}'
              priority: HIGH
              description: 'Root disk usage above 90%'
            - uuid: d5084b2c2e32464caab35352b971ac82
              expression: 'last(/Homelab VM/vfs.fs.size[/,pused])>{$FS.PUSED.MAX:=80}'
              name: 'Disk space low on {HOST.NAME} (>{$FS.PUSED.MAX:=80}%)'
              priority: AVERAGE
              manual_close: 'YES'
            - uuid: 26a0a810cc514d87b16fa728cf19642e
              expression: 'last(/Homelab VM/vfs.fs.size[/,pused])>80'
              name: 'Disk space warning on {HOST.NAME}'
              priority: WARNING
        - uuid: 61af80136dd84c9d99336111467a132a
          name: 'Disk space total /'
          key: 'vfs.fs.size[/,total]'
          delay: 3600s
          history: 7d
          units: B
        - uuid: 26f006dc6f7d47e08c77cd3bda5ba148
          name: 'Disk space used bytes /'
          key: 'vfs.fs.size[/,used]'
          delay: 60s
          history: 7d
          units: B
        - uuid: ea488dea9bd54fe398e4685159a29c8c
          name: 'Memory available'
          key: 'vm.memory.size[available]'
          delay: 60s
          history: 30d
          units: B
        - uuid: bb80b2d4d38b489c88100b4eda91f5a1
          name: 'Memory buffers'
          key: 'vm.memory.size[buffers]'
          delay: 60s
          history: 30d
          units: B
        - uuid: b8c189ba716e4516844d2298e4669d14
          name: 'Memory cached'
          key: 'vm.memory.size[cached]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 1d50de4ab7704e219fa7e40836933d5a
          name: 'Memory free'
          key: 'vm.memory.size[free]'
          delay: 60s
          history: 30d
          units: B
        - uuid: 146e83be67f542e59c0ee9d9376cad5f
          name: 'Memory used percentage'
          key: 'vm.memory.size[pused]'
          delay: '60'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: d382833176f44fa0b4d1131fe595c759
              expression: 'last(/Homelab VM/vm.memory.size[pused])>{$MEM.PUSED.MAX:=85}'
              name: 'High memory usage on {HOST.NAME} (>{$MEM.PUSED.MAX:=85}%)'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: 89e96855875d4764ba4b0d60826dc235
          name: 'Memory total'
          key: 'vm.memory.size[total]'
          delay: '300'
          units: B
        - uuid: ce0d74db96da4b92880df7c88effd41c
          name: 'Memory used'
          key: 'vm.memory.size[used]'
          delay: 60s
          history: 30d
          units: B
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '85'
        - macro: '{$LOAD.AVG.CRIT}'
          value: '10'
        - macro: '{$NET.IFACE}'
          value: eth0
          description: 'Primary network interface name'
  triggers:
    - uuid: a47efe1c05ac45a7908eb2e06cbd7764
      expression: 'avg(/Homelab VM/system.cpu.util[,user],5m)+avg(/Homelab VM/system.cpu.util[,system],5m)>85'
      name: 'High CPU usage on {HOST.NAME} (>{$CPU.UTIL.CRIT:=85}%)'
      priority: AVERAGE
      manual_close: 'YES'
    - uuid: 0be27ffd46cc42c6ae34337e20c4147b
      expression: 'last(/Homelab VM/vm.memory.size[available]) / last(/Homelab VM/vm.memory.size[total]) * 100 < 10'
      name: 'High memory on {HOST.NAME}'
      priority: HIGH
      description: |
        Memory usage is above 90%
        [fixed 2026-08-21] Was vm.memory.size[pused], which counts reclaimable page cache as used. PBS showed 93.7% 'used' while 93.7% was actually AVAILABLE (2.0G of 2.1G free, the rest being backup-IO page cache). Now measures real available memory.
    - uuid: 404450f1b5694608b2a3e280e71d0985
      expression: 'last(/Homelab VM/vm.memory.size[available]) / last(/Homelab VM/vm.memory.size[total]) * 100 < 20'
      name: 'High memory warning on {HOST.NAME}'
      priority: WARNING
      description: '[fixed 2026-08-21] Was vm.memory.size[pused], which counts reclaimable page cache as used. PBS showed 93.7% ''used'' while 93.7% was actually AVAILABLE (2.0G of 2.1G free, the rest being backup-IO page cache). Now measures real available memory.'
      manual_close: 'YES'
